[package]
name = "local-schedule"
version = "0.2.0"
description = "本地日程管理客户端 (LocalSchedule)"
authors = ["LocalSchedule"]
edition = "2021"

[lib]
name = "local_schedule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
